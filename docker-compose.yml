name: love-movie

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: love_movie
      POSTGRES_USER: love_movie
      POSTGRES_PASSWORD: love_movie
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U love_movie -d love_movie"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-love-movie-local}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-local-development-only}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-love-movie-local}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-local-development-only}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-love-movie-assets}
    volumes:
      - ./infra/minio/create-buckets.sh:/create-buckets.sh:ro
    entrypoint: ["/create-buckets.sh"]

  api:
    build:
      context: ./services/backend
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./services/backend
    command: ["python", "-m", "app.worker.main"]
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
  minio-data:
